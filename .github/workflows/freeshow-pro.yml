# Compila FreeShow Pro (tu version) para Windows y Mac, sin firma oficial.
# Se ejecuta a mano desde la pestaña "Actions" de GitHub o al subir cambios a la rama freeshow-pro.
name: FreeShow Pro - Compilar

on:
    workflow_dispatch:
    push:
        branches:
            - "freeshow-pro"

jobs:
    windows:
        name: Windows (instalador .exe)
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            - name: Instalar dependencias
              run: npm ci
            - name: Compilar
              run: npm run build
            - name: Crear instalador (sin firma)
              shell: bash
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  sed -e '/^afterSign:/d' -e '/azureSignOptions:/,/codeSigningAccountName:/d' config/building/electron-builder.yaml > config/building/electron-builder-local.yaml
                  npx electron-builder --config config/building/electron-builder-local.yaml --win nsis --x64 --publish never -c.productName="FreeShow Pro" -c.extraMetadata.productName=FreeShow -c.appId=app.freeshow.pro
            - uses: actions/upload-artifact@v4
              with:
                  name: FreeShow-Pro-Windows
                  path: dist/*.exe

    mac:
        name: Mac Apple Silicon (.dmg)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Instalar dependencias
              run: |
                  python -m pip install setuptools
                  npm ci
            - name: Compilar
              run: npm run build
            - name: Crear dmg (sin firma)
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: |
                  sed -e '/^afterSign:/d' config/building/electron-builder.yaml > config/building/electron-builder-local.yaml
                  npx electron-builder --config config/building/electron-builder-local.yaml --mac dmg --arm64 --publish never -c.mac.identity=null -c.productName="FreeShow Pro" -c.extraMetadata.productName=FreeShow -c.appId=app.freeshow.pro
            - uses: actions/upload-artifact@v4
              with:
                  name: FreeShow-Pro-Mac
                  path: dist/*.dmg
